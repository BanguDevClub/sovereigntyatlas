<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primary-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Accent glow circles -->
  <circle cx="200" cy="150" r="300" fill="#38bdf8" fill-opacity="0.08" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="350" fill="#0284c7" fill-opacity="0.08" filter="blur(90px)" />

  <!-- Badge -->
  <rect x="80" y="80" width="280" height="40" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" />
  <text x="100" y="105" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">
    BANGUDEVCLUB • MIT OPEN SOURCE
  </text>

  <!-- Main Title -->
  <text x="80" y="210" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5">
    Sovereignty Atlas <tspan fill="#38bdf8">2025</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="280" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="28" font-weight="400">
    Measuring the National Independence of 195 Sovereign Countries
  </text>

  <!-- 5 Pillars Badges -->
  <g transform="translate(80, 360)">
    <!-- 1. Consumption -->
    <rect x="0" y="0" width="190" height="90" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">RANK #1 • 28%</text>
    <text x="20" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Consumption</text>
    <text x="20" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Food, Fuel, Power, Water</text>

    <!-- 2. Employment -->
    <rect x="210" y="0" width="190" height="90" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
    <text x="230" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">RANK #2 • 25%</text>
    <text x="230" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Employment</text>
    <text x="230" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Formal jobs, Domestic value</text>

    <!-- 3. Technological -->
    <rect x="420" y="0" width="190" height="90" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
    <text x="440" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">RANK #3 • 20%</text>
    <text x="440" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Technology</text>
    <text x="440" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Chips, AI, Robotics, IP</text>

    <!-- 4. Scientific -->
    <rect x="630" y="0" width="190" height="90" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
    <text x="650" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">RANK #4 • 15%</text>
    <text x="650" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Scientific</text>
    <text x="650" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">STEM, Labs, R&amp;D Output</text>

    <!-- 5. Military -->
    <rect x="840" y="0" width="190" height="90" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
    <text x="860" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">RANK #5 • 12%</text>
    <text x="860" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Military</text>
    <text x="860" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Defense, Missiles, Triad</text>
  </g>

  <!-- Footer link -->
  <text x="80" y="530" fill="#64748b" font-family="system-ui, sans-serif" font-size="18">
    https://github.com/BanguDevClub/sovereigntyatlas
  </text>
  <text x="880" y="530" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="600">
    195 Countries Evaluated →
  </text>
</svg>

