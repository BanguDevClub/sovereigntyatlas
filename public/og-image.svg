<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0c1322" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Solid Clean High-Contrast Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Inner Architectural Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#0b1120" fill-opacity="0.6" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Glow Accent -->
  <circle cx="1020" cy="200" r="240" fill="#0284c7" fill-opacity="0.08" />

  <!-- Left Content Column (Strict Safe-Zone Margins: x=80 to x=720) -->
  <g transform="translate(80, 80)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="270" height="34" rx="17" fill="#131d31" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#38bdf8" />
    <text x="28" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      BANGUDEVCLUB • MIT OPEN SOURCE
    </text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">
      Sovereignty Atlas
    </text>
    <!-- Year Tag -->
    <rect x="470" y="58" width="70" height="36" rx="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="483" y="82" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800">
      2025
    </text>

    <!-- Subtitle -->
    <text x="0" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
      Measuring National Autonomy Across 195 Sovereign Nations
    </text>

    <!-- 5 Methodology Pillars (Minimal, High-Contrast Grid) -->
    <g transform="translate(0, 175)">
      <!-- Pillar 1: Consumption -->
      <rect x="0" y="0" width="300" height="64" rx="12" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="16" y="24" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">RANK 1 • 28% WEIGHT</text>
      <text x="16" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Consumption Sovereignty</text>

      <!-- Pillar 2: Employment -->
      <rect x="316" y="0" width="300" height="64" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="332" y="24" fill="#0ea5e9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">RANK 2 • 25% WEIGHT</text>
      <text x="332" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Employment Sovereignty</text>

      <!-- Pillar 3: Technology -->
      <rect x="0" y="76" width="198" height="64" rx="12" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="16" y="100" fill="#6366f1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">RANK 3 • 20%</text>
      <text x="16" y="123" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Technology</text>

      <!-- Pillar 4: Scientific -->
      <rect x="210" y="76" width="198" height="64" rx="12" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="226" y="100" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">RANK 4 • 15%</text>
      <text x="226" y="123" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Scientific</text>

      <!-- Pillar 5: Military -->
      <rect x="420" y="76" width="196" height="64" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="436" y="100" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">RANK 5 • 12%</text>
      <text x="436" y="123" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Military</text>
    </g>

    <!-- Footer URL & Attribution -->
    <g transform="translate(0, 365)">
      <text x="0" y="32" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="500">
        github.com/BanguDevClub/sovereigntyatlas
      </text>
      <text x="360" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
        Dashboards • Ranking • Compare • Sandbox
      </text>
    </g>
  </g>

  <!-- Right Decorative Globe / Radar Vector (Safe bounded inside x=780 to x=1100) -->
  <g transform="translate(940, 315)">
    <!-- Concentric radar rings -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1e293b" stroke-width="1.5" />

    <!-- Axis crosshair lines -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#1e293b" stroke-width="1" />

    <!-- Radar Sovereignty Polygon Example -->
    <polygon points="0,-125 110,-40 70,95 -75,90 -105,-35" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Radar node dots -->
    <circle cx="0" cy="-125" r="5" fill="#38bdf8" />
    <circle cx="110" cy="-40" r="5" fill="#38bdf8" />
    <circle cx="70" cy="95" r="5" fill="#38bdf8" />
    <circle cx="-75" cy="90" r="5" fill="#38bdf8" />
    <circle cx="-105" cy="-35" r="5" fill="#38bdf8" />

    <!-- Central Core -->
    <circle cx="0" cy="0" r="8" fill="#0284c7" />
    <circle cx="0" cy="0" r="4" fill="#f8fafc" />
  </g>
</svg>
